# Test profile — used for E2E tests (SPRING_PROFILES_ACTIVE=test)
# These values are safe test-only credentials and are never used in production.

# Bootstrap a test admin account at startup
app.admin.bootstrap.enabled=true
app.admin.email=admin@test.com
app.admin.initial-password=Admin123!

# Test-only: activate FakeEmailService and TestMailController
app.otp.test-mode=true

# Disable real mail sending in tests
app.mail.enabled=false
app.mail.from=
