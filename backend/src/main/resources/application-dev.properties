# Local development profile — activate with SPRING_PROFILES_ACTIVE=dev (or --spring.profiles.active=dev).
# Enables the H2 web console at http://localhost:8080/h2-console (JDBC URL jdbc:h2:mem:footballdb, user sa, no password).
# SecurityConfig permits /h2-console/** and relaxes frame-options ONLY when this property is true.
# Never use this profile outside a local machine.
spring.h2.console.enabled=true
