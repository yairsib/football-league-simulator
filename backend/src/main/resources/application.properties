# Server
server.port=8080

# H2 Database
spring.datasource.url=jdbc:h2:mem:footballdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 Console
# H2 console is OFF by default (it would expose the whole database with sa / blank password).
# Enable it for local development only via the dev profile: --spring.profiles.active=dev
spring.h2.console.enabled=false
spring.h2.console.path=/h2-console

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# JWT
jwt.secret=changeme-replace-with-a-long-random-secret-in-production
jwt.expiration=86400000

# Admin Bootstrap (configure via env vars; defaults are disabled/empty for safety)
# Set APP_ADMIN_BOOTSTRAP_ENABLED=true (once) with APP_ADMIN_EMAIL and APP_ADMIN_INITIAL_PASSWORD
# to create the initial admin account. Set back to false after first successful bootstrap.
app.admin.bootstrap.enabled=${APP_ADMIN_BOOTSTRAP_ENABLED:false}
app.admin.email=${APP_ADMIN_EMAIL:}
app.admin.initial-password=${APP_ADMIN_INITIAL_PASSWORD:}

# Mail (configure via env vars when email sending is needed)
# Required env vars when APP_MAIL_ENABLED=true:
#   APP_MAIL_FROM, SPRING_MAIL_HOST, SPRING_MAIL_PORT (default 587),
#   SPRING_MAIL_USERNAME, SPRING_MAIL_PASSWORD
app.mail.enabled=${APP_MAIL_ENABLED:false}
app.mail.from=${APP_MAIL_FROM:}

# Frontend origin for CORS (local dev; override via env var APP_FRONTEND_ORIGIN for production)
app.frontend.origin=${APP_FRONTEND_ORIGIN:http://localhost:5173}
